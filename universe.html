<!doctype html>
<!-- THESIS: A boy and his cat discover the universe through choices and a changing observatory window, not a dashboard of space trivia. OWN-WORLD: Transit Tales ivory flight desk and green ink frame indigo space, blue worlds, amber stars and violet dust; all art and music are procedural originals. STORY: Choose a destination and epoch, jump, answer a recoverable encounter and keep a discovery journal. FIRST VIEWPORT: Destination atlas at left, large Earth observation at right, crew at the window edge; flight controls and encounter desk immediately below, stacked on phones. FORM: Observatory window with field journal, third grounded structure; user-approved, surface seed cad4ca39. -->
<html lang="en" class="universe-booting"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101d32"><meta name="description" content="An original boy-and-cat universe adventure: explore cosmic scales, jump through time and discover the science behind the wonder."><title>Transit Tales — Universe Journey</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101d32'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%2387c8dd'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='9' fill='none' stroke='%23f0ce86' stroke-width='3' transform='rotate(-25 32 32)'/%3E%3C/svg%3E">
<style>
.universe-booting body{margin:0;background:#f4f1e7;color:#234d49;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.universe-startup{max-width:38rem;margin:12vh auto;padding:2rem;line-height:1.7}
.universe-startup h1{font-size:2rem;line-height:1.2}.universe-startup p{max-width:65ch}
.universe-startup nav{display:flex;flex-wrap:wrap}.universe-startup a{color:#234d49;padding:.75rem 0;margin-right:1.5rem;text-underline-offset:.2em}
.universe-startup a:focus-visible{outline:2px solid #234d49;outline-offset:4px}
.universe-startup .boot-zh{display:none}html[lang="zh-CN"] .universe-startup .boot-en{display:none}html[lang="zh-CN"] .universe-startup .boot-zh{display:inline}
#universe[hidden],.universe-startup[hidden]{display:none!important}
</style></head><body>
<section id="universe-startup" class="universe-startup" aria-labelledby="startup-title">
<h1 id="startup-title"><span class="boot-en">Milo & Pip’s Universe Journey</span><span class="boot-zh" lang="zh-CN">米洛与皮普——宇宙旅途</span></h1>
<p id="startup-status" role="status"><span class="boot-en">Preparing the observatory. On a slow connection, this may take a moment.</span><span class="boot-zh" lang="zh-CN">正在准备观景窗。网络较慢时，请稍候。</span></p>
<nav aria-label="Loading options"><a id="startup-retry" href="universe.html"><span class="boot-en">Retry loading</span><span class="boot-zh" lang="zh-CN">重新加载</span></a><a id="startup-fresh" href="universe.html" target="_blank" rel="noopener"><span class="boot-en">Open game in a new tab</span><span class="boot-zh" lang="zh-CN">在新标签页打开游戏</span></a><a href="?view=2d"><span class="boot-en">Try 2D mode</span><span class="boot-zh" lang="zh-CN">尝试二维模式</span></a><a href="index.html"><span class="boot-en">Return to games</span><span class="boot-zh" lang="zh-CN">返回游戏主页</span></a></nav>
<noscript><p>This journey needs JavaScript. Please enable it, or return to the other games. 本游戏需要 JavaScript。请启用它，或返回游戏主页。</p></noscript>
</section><div id="universe" hidden></div>
<script>
(function () {
  var root = document.getElementById('universe'), startup = document.getElementById('universe-startup');
  var status = document.getElementById('startup-status'), chinese = /^zh/i.test(navigator.language || '');
  var settled = false, timer;
  if (chinese) document.documentElement.lang = 'zh-CN';
  var fresh = new URL(location.href); fresh.searchParams.set('retry', String(Date.now()));
  document.getElementById('startup-fresh').href = fresh.href;
  function failed() {
    if (settled) return;
    window.clearTimeout(timer); startup.setAttribute('data-state', 'error');
    status.textContent = chinese ? '游戏未能启动。请检查网络后重新加载；如果仍然失败，请在新标签页打开游戏。也可尝试二维模式。' : 'The game could not start. Check your connection and retry loading. If it still fails, open the game in a new tab. You can also try 2D mode.';
  }
  document.getElementById('startup-retry').addEventListener('click', function (event) {
    event.preventDefault();
    var address = new URL(location.href); address.searchParams.set('retry', String(Date.now()));
    location.replace(address.href);
  });
  document.addEventListener('universe-startup-error', failed);
  window.addEventListener('error', function (event) {
    if (event.target === window || /^(SCRIPT|LINK)$/.test(event.target.tagName || '')) failed();
  }, true);
  document.addEventListener('universe-ready', function () {
    settled = true; window.clearTimeout(timer); root.hidden = false; startup.hidden = true;
    document.documentElement.classList.remove('universe-booting');
  });
  document.addEventListener('DOMContentLoaded', function () {
    var entry = document.querySelector('script[data-universe-entry]');
    if (!entry) { failed(); return; }
    var retry = new URLSearchParams(location.search).get('retry');
    function address(href) {
      var url = new URL(href, location.href);
      if (retry) url.searchParams.set('retry', retry);
      return url.href;
    }
    var styles = Array.prototype.map.call(document.querySelectorAll('link[data-universe-style]'), function (preload) {
      return new Promise(function (resolve, reject) {
        var link = document.createElement('link'); link.rel = 'stylesheet'; link.media = 'print';
        link.onload = function () { link.media = 'all'; resolve(); };
        link.onerror = reject; link.href = address(preload.href);
        document.head.appendChild(link);
      });
    });
    Promise.all(styles).then(function () { return import(address(entry.src)); }).catch(function (error) {
      console.error('Universe Journey could not start', error); failed();
    });
  });
  timer = window.setTimeout(function () {
    if (settled) return;
    startup.setAttribute('data-state', 'slow');
    status.textContent = chinese ? '加载时间较长。请检查网络，重新加载，或返回其他游戏；网络恢复后本页也会继续加载。' : 'Loading is taking longer than expected. Check your connection, retry, or return to the other games. This page will continue loading if the connection recovers.';
  }, 12000);
}());
</script>
<script type="module" src="/src/universe/main.ts"></script>
</body></html>
