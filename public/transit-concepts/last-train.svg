<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Last Train Home gameplay concept</title><desc id="desc">Not every passenger is alive. Every passenger still deserves the right stop. A child holds an old ticket to a renamed station. The physical station still exists, but an evening newspaper and a changing map let you connect its old name to the new one. The child vanishes gently after the correct announcement.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#405ab0" font-weight="bold">Last Train Home / 末班车：送你回家</text><rect x="70" y="85" width="850" height="355" rx="14" fill="#dce5f5" stroke="#203249" stroke-width="3"/><rect x="108" y="120" width="520" height="150" rx="8" fill="#203249" stroke="none" stroke-width="3"/><line x1="235" y1="120" x2="235" y2="270" stroke="#dce5f5" stroke-width="7" stroke-linecap="round"/><line x1="380" y1="120" x2="380" y2="270" stroke="#dce5f5" stroke-width="7" stroke-linecap="round"/><line x1="525" y1="120" x2="525" y2="270" stroke="#dce5f5" stroke-width="7" stroke-linecap="round"/><g opacity="0.65"><circle cx="300" cy="158" r="13" fill="#c6daf3" stroke="none" stroke-width="4"/><rect x="284" y="175" width="32" height="42" rx="13" fill="#c6daf3" stroke="none" stroke-width="3"/><line x1="292" y1="213" x2="290" y2="232" stroke="#c6daf3" stroke-width="7" stroke-linecap="round"/><line x1="308" y1="213" x2="310" y2="232" stroke="#c6daf3" stroke-width="7" stroke-linecap="round"/></g><text x="130" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="normal">A reflection without a passenger</text><rect x="110" y="335" width="510" height="40" rx="10" fill="#687fc1" stroke="none" stroke-width="3"/><g opacity="1"><circle cx="205" cy="270" r="13" fill="#e3b863" stroke="none" stroke-width="4"/><rect x="189" y="287" width="32" height="42" rx="13" fill="#e3b863" stroke="none" stroke-width="3"/><line x1="197" y1="325" x2="195" y2="344" stroke="#e3b863" stroke-width="7" stroke-linecap="round"/><line x1="213" y1="325" x2="215" y2="344" stroke="#e3b863" stroke-width="7" stroke-linecap="round"/></g><g opacity="1"><circle cx="475" cy="265" r="13" fill="#70af98" stroke="none" stroke-width="4"/><rect x="459" y="282" width="32" height="42" rx="13" fill="#70af98" stroke="none" stroke-width="3"/><line x1="467" y1="320" x2="465" y2="339" stroke="#70af98" stroke-width="7" stroke-linecap="round"/><line x1="483" y1="320" x2="485" y2="339" stroke="#70af98" stroke-width="7" stroke-linecap="round"/></g><rect x="655" y="120" width="225" height="265" rx="8" fill="#fff8ec" stroke="none" stroke-width="3"/><text x="675" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#405ab0" font-weight="bold">CLUE NOTEBOOK</text><text x="675" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">Old station name</text><text x="675" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">Renamed in 1984</text><text x="675" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">Ticket matches!</text><line x1="682" y1="285" x2="850" y2="285" stroke="#405ab0" stroke-width="3" stroke-linecap="round"/><text x="675" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#405ab0" font-weight="bold">NEXT: CENTRAL</text><text x="675" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">Help them home.</text><text x="55" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#536174" font-weight="normal">ORIGINAL GAMEPLAY DIAGRAM · NOT A PLAYABLE SCREENSHOT</text></svg>