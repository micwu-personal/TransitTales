<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Transfer Garden gameplay concept</title><desc id="desc">Build an interchange that feels like a welcoming little garden, not a confusing maze. A short escalator clears one queue but floods a narrow bridge. Widening the bridge is expensive. Moving a sign and routing exiting passengers around a garden solves the jam while keeping the step-free route intact.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#356d35" font-weight="bold">Transfer Garden / 换乘花园</text><rect x="85" y="120" width="810" height="280" rx="8" fill="#dfe9d9" stroke="none" stroke-width="3"/><rect x="105" y="140" width="770" height="55" rx="6" fill="#3b6cc0" stroke="none" stroke-width="3"/><rect x="105" y="335" width="770" height="45" rx="6" fill="#c75039" stroke="none" stroke-width="3"/><rect x="385" y="195" width="100" height="140" rx="0" fill="#fff8ec" stroke="none" stroke-width="3"/><rect x="610" y="195" width="115" height="140" rx="0" fill="#fff8ec" stroke="none" stroke-width="3"/><rect x="125" y="208" width="200" height="110" rx="15" fill="#b5cea6" stroke="none" stroke-width="3"/><circle cx="155" cy="232" r="21" fill="#5b9656" stroke="none" stroke-width="4"/><circle cx="245" cy="276" r="21" fill="#5b9656" stroke="none" stroke-width="4"/><circle cx="298" cy="234" r="21" fill="#5b9656" stroke="none" stroke-width="4"/><line x1="415" y1="302" x2="460" y2="225" stroke="#dd9a32" stroke-width="19" stroke-linecap="round"/><rect x="625" y="230" width="40" height="72" rx="5" fill="#203249" stroke="none" stroke-width="3"/><text x="630" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#ffffff" font-weight="normal">↕</text><g opacity="1"><circle cx="360" cy="150" r="13" fill="#fff0cb" stroke="none" stroke-width="4"/><rect x="344" y="167" width="32" height="42" rx="13" fill="#fff0cb" stroke="none" stroke-width="3"/><line x1="352" y1="205" x2="350" y2="224" stroke="#fff0cb" stroke-width="7" stroke-linecap="round"/><line x1="368" y1="205" x2="370" y2="224" stroke="#fff0cb" stroke-width="7" stroke-linecap="round"/></g><g opacity="1"><circle cx="450" cy="265" r="13" fill="#dd9a32" stroke="none" stroke-width="4"/><rect x="434" y="282" width="32" height="42" rx="13" fill="#dd9a32" stroke="none" stroke-width="3"/><line x1="442" y1="320" x2="440" y2="339" stroke="#dd9a32" stroke-width="7" stroke-linecap="round"/><line x1="458" y1="320" x2="460" y2="339" stroke="#dd9a32" stroke-width="7" stroke-linecap="round"/></g><g opacity="1"><circle cx="730" cy="325" r="13" fill="#75bbce" stroke="none" stroke-width="4"/><rect x="714" y="342" width="32" height="42" rx="13" fill="#75bbce" stroke="none" stroke-width="3"/><line x1="722" y1="380" x2="720" y2="399" stroke="#75bbce" stroke-width="7" stroke-linecap="round"/><line x1="738" y1="380" x2="740" y2="399" stroke="#75bbce" stroke-width="7" stroke-linecap="round"/></g><g opacity="1"><circle cx="780" cy="325" r="13" fill="#75bbce" stroke="none" stroke-width="4"/><rect x="764" y="342" width="32" height="42" rx="13" fill="#75bbce" stroke="none" stroke-width="3"/><line x1="772" y1="380" x2="770" y2="399" stroke="#75bbce" stroke-width="7" stroke-linecap="round"/><line x1="788" y1="380" x2="790" y2="399" stroke="#75bbce" stroke-width="7" stroke-linecap="round"/></g><text x="115" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#3b6cc0" font-weight="bold">BLUE LINE</text><text x="115" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#c75039" font-weight="bold">RED LINE</text><text x="500" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#203249" font-weight="normal">Escalator + step-free lift route</text><text x="120" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#203249" font-weight="normal">Garden detour separates exiting passengers from transfers.</text><text x="55" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#536174" font-weight="normal">ORIGINAL GAMEPLAY DIAGRAM · NOT A PLAYABLE SCREENSHOT</text></svg>