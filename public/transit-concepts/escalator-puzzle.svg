<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Escalator Orchestra gameplay concept</title><desc id="desc">Fit moving stairways together, then watch a shopping mall turn into a little people machine. A red shopper needs floor 3, a blue shopper needs floor 2, and you have one long escalator left. A timed junction sends the first to the bridge and the second upward. The whole mall plays a satisfying two-note chord.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#00796d" font-weight="bold">Escalator Orchestra / 扶梯拼拼乐</text><line x1="80" y1="95" x2="80" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="150" y1="95" x2="150" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="220" y1="95" x2="220" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="290" y1="95" x2="290" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="360" y1="95" x2="360" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="430" y1="95" x2="430" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="500" y1="95" x2="500" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="570" y1="95" x2="570" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="640" y1="95" x2="640" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="710" y1="95" x2="710" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="780" y1="95" x2="780" y2="435" stroke="#d5e4df" stroke-width="1" stroke-linecap="round"/><line x1="75" y1="130" x2="780" y2="130" stroke="#a7b9b2" stroke-width="5" stroke-linecap="round"/><text x="810" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#203249" font-wei