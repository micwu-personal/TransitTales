<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">The Missing Line gameplay concept</title><desc id="desc">An extra line appears on the map only after midnight. Discover its rules before it folds the city. Your journey log says A → B took two minutes, but B → A took you to C. Comparing two rides reveals that the phantom shuttle advances one station each time the normal circle line crosses midnight.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#a33564" font-weight="bold">The Missing Line / 不存在的环线</text><line x1="100" y1="170" x2="280" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="280" y1="170" x2="470" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="170" x2="660" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="660" y1="170" x2="860" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="85" x2="470" y2="170" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="170" x2="470" y2="320" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="320" x2="660" y2="430" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="660" y1="430" x2="860" y2="430" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><circle cx="100" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="68" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Harbor</text><circle cx="280" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="248" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Market</text><circle cx="470" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="438" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Central</text><circle cx="660" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="628" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Museum</text><circle cx="860" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="828" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Garden</text><circle cx="470" cy="85" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="490" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">North</text><circle cx="470" cy="320" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="490" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Library</text><circle cx="660" cy="430" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="680" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Stadium</text><circle cx="860" cy="430" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="880" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Airport</text><line x1="280" y1="170" x2="300" y2="350" stroke="#a33564" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/><line x1="300" y1="350" x2="660" y2="430" stroke="#a33564" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/><circle cx="300" cy="350" r="16" fill="#a33564" stroke="none" stroke-width="4"/><text x="185" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#a33564" font-weight="bold">Midnight platform ?</text><rect x="545" y="250" width="350" height="110" rx="10" fill="#ffffff" stroke="none" stroke-width="3"/><text x="565" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#a33564" font-weight="bold">HYPOTHESIS NOTEBOOK</text><text x="565" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">A → B : normal ride</text><text x="565" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#203249" font-weight="normal">B → A : arrived at C ?!</text><text x="110" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#a33564" font-weight="bold">Test a theory. Reveal a hidden connection. Rescue a rider.</text><text x="55" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#536174" font-weight="normal">ORIGINAL GAMEPLAY DIAGRAM · NOT A PLAYABLE SCREENSHOT</text></svg>