<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Shaft Sprint gameplay concept</title><desc id="desc">Race elevator cabins through a tower made of lanes, stops, and deliciously risky shortcuts. The leader takes the straight express shaft. You brake at the laundromat, pick up a delivery battery, and use a diagonal maintenance connector to emerge one floor ahead.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#b54a22" font-weight="bold">Shaft Sprint / 升降冲刺</text><rect x="190" y="90" width="135" height="355" rx="6" fill="#dae0e7" stroke="none" stroke-width="3"/><line x1="257" y1="95" x2="257" y2="440" stroke="#758596" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><rect x="455" y="90" width="135" height="355" rx="6" fill="#dae0e7" stroke="none" stroke-width="3"/><line x1="522" y1="95" x2="522" y2="440" stroke="#758596" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><rect x="720" y="90" width="135" height="355" rx="6" fill="#dae0e7" stroke="none" stroke-width="3"/><line x1="787" y1="95" x2="787" y2="440" stroke="#758596" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><line x1="220" y1="180" x2="820" y2="180" stroke="#203249" stroke-width="8" stroke-linecap="round"/><line x1="220" y1="320" x2="820" y2="320" stroke="#203249" stroke-width="8" stroke-linecap="round"/><line x1="285" y1="330" x2="755" y2="180" stroke="#b54a22" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 10"/><text x="375" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b54a22" font-weight="bold">MAINTENANCE SHORTCUT</text><rect x="200" y="260" width="115" height="100" rx="12" fill="#b54a22" stroke="#203249" stroke-width="3"/><rect x="214" y="273" width="87" height="50" rx="6" fill="#e6f5fc" stroke="none" stroke-width="3"/><line x1="258" y1="275" x2="258" y2="323" stroke="#203249" stroke-width="3" stroke-linecap="round"/><text x="212" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ffffff" font-weight="bold">YOU</text><rect x="465" y="125" width="115" height="100" rx="12" fill="#497ab6" stroke="#203249" stroke-width="3"/><rect x="479" y="138" width="87" height="50" rx="6" fill="#e6f5fc" stroke="none" stroke-width="3"/><line x1="523" y1="140" x2="523" y2="188" stroke="#203249" stroke-width="3" stroke-linecap="round"/><text x="477" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ffffff" font-weight="bold">RIVAL</text><rect x="730" y="340" width="115" height="100" rx="12" fill="#638948" stroke="#203249" stroke-width="3"/><rect x="744" y="353" width="87" height="50" rx="6" fill="#e6f5fc" stroke="none" stroke-width="3"/><line x1="788" y1="355" x2="788" y2="403" stroke="#203249" stroke-width="3" stroke-linecap="round"/><text x="742" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ffffff" font-weight="bold">RIVAL</text><rect x="430" y="385" width="185" height="55" rx="8" fill="#fff4d6" stroke="none" stroke-width="3"/><text x="450" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#203249" font-weight="normal">Battery pickup</text><text x="115" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#b54a22" font-weight="bold">BRAKE → TRANSFER → BOOST</text><text x="55" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#536174" font-weight="normal">ORIGINAL GAMEPLAY DIAGRAM · NOT A PLAYABLE SCREENSHOT</text></svg>