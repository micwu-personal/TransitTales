<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">One Ticket, Many Errands gameplay concept</title><desc id="desc">Turn a familiar subway map into a city-sized puzzle of tiny acts of kindness. Two errands point in opposite directions. Completing the umbrella delivery first unlocks a locker at the interchange, letting you stash the bulky parcel and take a faster loop to the picnic.</desc><rect width="1000" height="560" fill="#f4f1e9"/><text x="55" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#8a5b0c" font-weight="bold">One Ticket, Many Errands / 一票通城</text><line x1="100" y1="170" x2="280" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="280" y1="170" x2="470" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="170" x2="660" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="660" y1="170" x2="860" y2="170" stroke="#c75039" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="85" x2="470" y2="170" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="170" x2="470" y2="320" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="470" y1="320" x2="660" y2="430" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><line x1="660" y1="430" x2="860" y2="430" stroke="#3b6cc0" stroke-width="13" stroke-linecap="round"/><circle cx="100" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="68" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Harbor</text><circle cx="280" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="248" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Market</text><circle cx="470" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="438" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Central</text><circle cx="660" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="628" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Museum</text><circle cx="860" cy="170" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="828" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Garden</text><circle cx="470" cy="85" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="490" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">North</text><circle cx="470" cy="320" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="490" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Library</text><circle cx="660" cy="430" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="680" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Stadium</text><circle cx="860" cy="430" r="12" fill="#fff" stroke="#203249" stroke-width="4"/><text x="880" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Airport</text><rect x="80" y="255" width="280" height="180" rx="10" fill="#ffffff" stroke="none" stroke-width="3"/><text x="100" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#8a5b0c" font-weight="bold">TODAY’S ERRANDS</text><text x="100" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">☂ Return umbrella · Market</text><text x="100" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">▣ Store parcel · Central</text><text x="100" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">✿ Picnic · Garden by 18:00</text><line x1="110" y1="200" x2="450" y2="200" stroke="#8a5b0c" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="490" y1="200" x2="850" y2="200" stroke="#8a5b0c" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/><text x="560" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#8a5b0c" font-weight="bold">YOUR PLAN: 2 TRANSFERS</text><text x="560" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203249" font-weight="normal">Bag: cake + umbrella + parcel</text><rect x="550" y="340" width="345" height="62" rx="8" fill="#fff0cc" stroke="none" stroke-width="3"/><text x="565" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#203249" font-weight="normal">Locker frees one bag space</text><text x="55" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#536174" font-weight="normal">ORIGINAL GAMEPLAY DIAGRAM · NOT A PLAYABLE SCREENSHOT</text></svg>